name: Toolchain Probe

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Environment
        run: |
          java -version 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
      - name: Artifact versions
        run: |
          probe() {
            echo "===== $1 (filter:${2:-.}) ====="
            curl -s "https://dl.google.com/dl/android/maven2/$1/maven-metadata.xml" \
              | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | grep -E "${2:-.}" | tail -n "${3:-10}"
          }
          probe com/android/tools/build/gradle '^8\.' 8
          probe androidx/compose/material3/material3 '^1\.4\.' 8
          probe androidx/datastore/datastore-preferences '^1\.[0-9]+\.[0-9]+$' 6
          probe androidx/core/core-splashscreen '.' 6
          probe androidx/compose/material3/adaptive/adaptive '.' 6
          probe androidx/compose/material3/material3-adaptive-navigation-suite '^1\.4' 6
          probe androidx/compose/material3/material3-window-size-class '^1\.4' 6
          probe androidx/hilt/hilt-navigation-compose '.' 4
          echo "===== gradle-compat note ====="
          curl -s "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml" | grep -o '<version>8\.[0-9]*\.[0-9]*</version>' | sed 's/<[^>]*>//g' | tail -3
