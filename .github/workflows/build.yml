name: Build

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

# Read-only. This workflow used to push build reports back to the branch and
# force-replace a `dist` branch, which buried real history under `[skip ci]`
# commits. Everything it produces is now an artifact instead.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolved versions
        run: |
          set +e
          ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath 2>/dev/null \
            | grep -E "androidx.compose|material3|kotlin-stdlib|androidx.activity|androidx.navigation|androidx.lifecycle" \
            | sed 's/[+\\|-]//g' | sed 's/^ *//' | sort -u | head -40 > /tmp/versions.txt
          cat /tmp/versions.txt
          exit 0

      - name: Assemble debug
        id: assemble
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Unit tests
        id: tests
        if: steps.assemble.outputs.code == '0'
        run: |
          set +e
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee /tmp/test.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect report
        run: |
          mkdir -p ci dist
          {
            echo "commit:  $GITHUB_SHA"
            echo "run:     $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "when:    $(date -u +%FT%TZ)"
            echo "assemble exit: ${{ steps.assemble.outputs.code }}"
            echo "tests exit:    ${{ steps.tests.outputs.code }}"
            echo
            echo "===== resolved versions ====="
            cat /tmp/versions.txt 2>/dev/null | head -40
            echo
            echo "===== kotlin/java errors ====="
            grep -E "^(e:|w: .*error)|error:|^\s+> " /tmp/build.log | grep -v "^w: " | head -150
            echo
            echo "===== gradle failure block ====="
            awk '/What went wrong/{p=14} p&&p--' /tmp/build.log | head -60
            echo
            echo "===== tail ====="
            tail -50 /tmp/build.log
            if [ -f /tmp/test.log ]; then
              echo
              echo "===== test failures ====="
              grep -E "FAILED|expected:|actual:|AssertionError" /tmp/test.log | head -60
            fi
          } > ci/last-build.txt

          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" dist/range-debug.apk
            ls -l dist/range-debug.apk >> ci/last-build.txt
          fi
          echo "apk: ${APK:-none}" >> ci/last-build.txt

      # Debug APK and build report are artifacts on the run, not commits and not
      # a "release". Shipping an unsigned debug build as the download people
      # find first was the wrong default; real downloads come from a tagged
      # release built by release.yml.
      - name: Upload debug APK
        if: hashFiles('dist/range-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: range-debug-apk
          path: dist/range-debug.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: ci/last-build.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail if build failed
        run: exit ${{ steps.assemble.outputs.code }}
