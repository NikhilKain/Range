name: Build Debug APK

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        id: assemble
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Unit tests
        id: tests
        if: steps.assemble.outputs.code == '0'
        run: |
          set +e
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee /tmp/test.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect report
        run: |
          mkdir -p ci dist
          {
            echo "commit:  $GITHUB_SHA"
            echo "run:     $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "when:    $(date -u +%FT%TZ)"
            echo "assemble exit: ${{ steps.assemble.outputs.code }}"
            echo "tests exit:    ${{ steps.tests.outputs.code }}"
            echo
            echo "===== kotlin/java errors ====="
            grep -E "^(e:|w: .*error)|error:|^\s+> " /tmp/build.log | grep -v "^w: " | head -150
            echo
            echo "===== gradle failure block ====="
            awk '/FAILURE: Build|What went wrong|Caused by:/{p=40} p&&p--' /tmp/build.log | head -120
            echo
            echo "===== tail ====="
            tail -50 /tmp/build.log
            if [ -f /tmp/test.log ]; then
              echo
              echo "===== test failures ====="
              grep -E "FAILED|expected:|actual:|AssertionError" /tmp/test.log | head -60
            fi
          } > ci/last-build.txt

          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" dist/range-debug.apk
            ls -l dist/range-debug.apk >> ci/last-build.txt
          fi

      - name: Upload APK artifact
        if: hashFiles('dist/range-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: range-debug-apk
          path: dist/range-debug.apk
          if-no-files-found: ignore

      - name: Push report back to branch
        run: |
          git config user.name "range-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci/last-build.txt dist/range-debug.apk 2>/dev/null || true
          git add -f ci/last-build.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: build report for ${GITHUB_SHA:0:7} [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((i*3))
            done
          fi

      - name: Fail if build failed
        run: exit ${{ steps.assemble.outputs.code }}
