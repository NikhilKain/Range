name: Build Debug APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolved versions
        run: |
          set +e
          ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath 2>/dev/null \
            | grep -E "androidx.compose|material3|kotlin-stdlib|androidx.activity|androidx.navigation|androidx.lifecycle" \
            | sed 's/[+\\|-]//g' | sed 's/^ *//' | sort -u | head -40 > /tmp/versions.txt
          cat /tmp/versions.txt
          exit 0

      - name: Assemble debug
        id: assemble
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Unit tests
        id: tests
        if: steps.assemble.outputs.code == '0'
        run: |
          set +e
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee /tmp/test.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect report
        run: |
          mkdir -p ci dist
          {
            echo "commit:  $GITHUB_SHA"
            echo "run:     $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "when:    $(date -u +%FT%TZ)"
            echo "assemble exit: ${{ steps.assemble.outputs.code }}"
            echo "tests exit:    ${{ steps.tests.outputs.code }}"
            echo
            echo "===== resolved versions ====="
            cat /tmp/versions.txt 2>/dev/null | head -40
            echo
            echo "===== kotlin/java errors ====="
            grep -E "^(e:|w: .*error)|error:|^\s+> " /tmp/build.log | grep -v "^w: " | head -150
            echo
            echo "===== gradle failure block ====="
            awk '/What went wrong/{p=14} p&&p--' /tmp/build.log | head -60
            echo
            echo "===== tail ====="
            tail -50 /tmp/build.log
            if [ -f /tmp/test.log ]; then
              echo
              echo "===== test failures ====="
              grep -E "FAILED|expected:|actual:|AssertionError" /tmp/test.log | head -60
            fi
          } > ci/last-build.txt

          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" dist/range-debug.apk
            ls -l dist/range-debug.apk >> ci/last-build.txt
          fi
          echo "apk: ${APK:-none}" >> ci/last-build.txt

      - name: Upload APK artifact
        if: hashFiles('dist/range-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: range-debug-apk
          path: dist/range-debug.apk
          if-no-files-found: ignore

      - name: Push report back to branch
        run: |
          git config user.name "range-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci/last-build.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: build report for ${GITHUB_SHA:0:7} [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((i*3))
            done
          fi

      - name: Publish APK to the dist branch
        if: steps.assemble.outputs.code == '0' && github.ref == 'refs/heads/main'
        run: |
          # A single-commit orphan branch, force-replaced each build: the APK is
          # always fetchable but the repo never accumulates 20 MB binaries.
          rm -rf /tmp/distrepo && mkdir -p /tmp/distrepo
          cp dist/range-debug.apk /tmp/distrepo/
          cd /tmp/distrepo
          {
            echo "# Range — latest debug build"
            echo
            echo "Built from \`${GITHUB_SHA:0:7}\` on $(date -u +%F\ %T) UTC."
            echo "This branch is replaced on every build and holds no history."
          } > README.md
          git init -q
          git checkout -q -b dist
          git config user.name "range-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "range-debug.apk @ ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" dist

      - name: Publish rolling debug release
        if: steps.assemble.outputs.code == '0' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug --yes --cleanup-tag 2>/dev/null || true
          gh release create debug dist/range-debug.apk \
            --title "Range — latest debug build" \
            --notes "Debug APK built from \`${GITHUB_SHA:0:7}\` on $(date -u +%F). Install on any Android 8.0+ device." \
            --latest

      - name: Fail if build failed
        run: exit ${{ steps.assemble.outputs.code }}
