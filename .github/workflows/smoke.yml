name: Emulator Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'app/src/main/**'
      - '.github/workflows/smoke.yml'
      - '.github/scripts/**'

# Read-only: screenshots are artifacts on the run rather than commits, so a
# UI check no longer writes to the branch it is checking.
permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Run app on emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/drive.sh

      - name: Pillow for screenshot downscaling
        if: always()
        run: pip install --quiet Pillow

      - name: Collect
        if: always()
        run: |
          mkdir -p ci/shots
          # Stale frames from an earlier run are worse than none: they get read
          # as if they were this run's evidence.
          rm -f ci/shots/*.png
          cp -f /tmp/shots/*.png ci/shots/ 2>/dev/null || true
          # Downscale: full-resolution frames bloat the repo fast.
          for f in ci/shots/*.png; do
            python3 -c "from PIL import Image; import sys; im=Image.open(sys.argv[1]); im.thumbnail((480,1066), Image.LANCZOS); im.save(sys.argv[1], optimize=True)" "$f" || true
          done
          cp -f /tmp/shots/report.txt ci/smoke-report.txt 2>/dev/null || true
          ls -l ci/shots || true

      - name: Check the themes actually rendered
        if: always()
        run: |
          python3 - <<'CHECK'
          import glob, os, sys
          from PIL import Image

          def brightness(path):
              im = Image.open(path).convert("L").resize((48, 96))
              px = list(im.getdata())
              return sum(px) / len(px)

          shots = {os.path.basename(f): brightness(f) for f in sorted(glob.glob("ci/shots/*.png"))}
          if not shots:
              print("no screenshots captured")
              sys.exit(0)

          print(f"{'screenshot':34s} {'mean':>6s}  verdict")
          for name, value in shots.items():
              tag = "LIGHT" if value > 140 else ("dark" if value > 12 else "BLANK")
              print(f"{name:34s} {value:6.1f}  {tag}")

          def mean_of(prefix):
              hits = [v for k, v in shots.items() if k.startswith(prefix)]
              return hits[0] if hits else None

          problems = []
          # Each pass sets its theme by name first, so these are real
          # assertions about the app and not about the emulator's system
          # setting. A theme that silently fails to apply looks perfectly fine
          # in a green build and wrong on a phone; this is what catches it.
          for prefix in ("21-dark-home", "21-dark-explore", "21-dark-detail"):
              v = mean_of(prefix)
              if v is None:
                  problems.append(f"{prefix} was never captured")
              elif v > 140:
                  problems.append(f"{prefix} is not dark ({v:.0f}) — dark theme did not apply")
          for prefix in ("24-light-home", "24-light-explore", "24-light-detail"):
              v = mean_of(prefix)
              if v is None:
                  problems.append(f"{prefix} was never captured")
              elif v < 140:
                  problems.append(f"{prefix} is not light ({v:.0f}) — light theme did not apply")

          blanks = [k for k, v in shots.items() if v < 3]
          if blanks:
              print(f"\nnote: {len(blanks)} blank frame(s), usually a mid-animation grab: {blanks}")

          if problems:
              print("\nTHEME CHECK FAILED")
              for p in problems:
                  print(" -", p)
              sys.exit(1)
          print("\nTheme check passed.")
          CHECK

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: |
            ci/shots/
            ci/smoke-report.txt
          if-no-files-found: ignore
          retention-days: 14
