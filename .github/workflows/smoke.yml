name: Emulator Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'app/src/main/**'
      - '.github/workflows/smoke.yml'

permissions:
  contents: write

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Run app on emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/drive.sh

      - name: Collect
        if: always()
        run: |
          mkdir -p ci/shots
          cp -f /tmp/shots/*.png ci/shots/ 2>/dev/null || true
          cp -f /tmp/shots/report.txt ci/smoke-report.txt 2>/dev/null || true
          ls -l ci/shots || true

      - name: Push screenshots back to branch
        if: always()
        run: |
          git config user.name "range-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci/shots ci/smoke-report.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: smoke screenshots for ${GITHUB_SHA:0:7} [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((i*3))
            done
          fi
