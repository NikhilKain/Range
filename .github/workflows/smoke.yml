name: Emulator Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'app/src/main/**'
      - '.github/workflows/smoke.yml'
      - '.github/scripts/**'

# Read-only: screenshots are artifacts on the run rather than commits, so a
# UI check no longer writes to the branch it is checking.
permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Run app on emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/drive.sh

      - name: Pillow for screenshot downscaling
        if: always()
        run: pip install --quiet Pillow

      - name: Collect
        if: always()
        run: |
          mkdir -p ci/shots
          cp -f /tmp/shots/*.png ci/shots/ 2>/dev/null || true
          # Downscale: full-resolution frames bloat the repo fast.
          for f in ci/shots/*.png; do
            python3 -c "from PIL import Image; import sys; im=Image.open(sys.argv[1]); im.thumbnail((480,1066), Image.LANCZOS); im.save(sys.argv[1], optimize=True)" "$f" || true
          done
          cp -f /tmp/shots/report.txt ci/smoke-report.txt 2>/dev/null || true
          ls -l ci/shots || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: |
            ci/shots/
            ci/smoke-report.txt
          if-no-files-found: ignore
          retention-days: 14
